<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>XMON Multi-Batch & DOM Automated Test Suite</title>
  <style>
    body { font-family: monospace; background: #0a0b10; color: #e0e0e0; padding: 24px; line-height: 1.5; }
    h1 { color: #fff; font-size: 20px; border-bottom: 1px solid #333; padding-bottom: 8px; }
    .pass { color: #2ecc71; font-weight: bold; }
    .fail { color: #e74c3c; font-weight: bold; }
    .info { color: #3498db; }
    .log-line { margin: 4px 0; }
    #results { margin-top: 16px; background: #12131c; padding: 16px; border-radius: 8px; border: 1px solid #222; }
  </style>
</head>
<body>
  <h1>XMON YouTube Shorts Bulk Publisher - Automated Verification Test</h1>
  <div id="test-sandbox" style="display:none;"></div>
  <div id="results">Running tests...</div>

  <script>
    const resultsEl = document.getElementById('results');
    const logs = [];
    let passed = 0;
    let failed = 0;

    function assert(condition, testName, detail = '') {
      if (condition) {
        passed++;
        logs.push(`<div class="log-line"><span class="pass">[PASS]</span> ${testName} ${detail ? '<span class="info">(' + detail + ')</span>' : ''}</div>`);
        console.log(`[PASS] ${testName}`);
      } else {
        failed++;
        logs.push(`<div class="log-line"><span class="fail">[FAIL]</span> ${testName} ${detail ? '<span class="fail">(' + detail + ')</span>' : ''}</div>`);
        console.error(`[FAIL] ${testName}: ${detail}`);
      }
    }

    // Mock chrome extension environment for content.js
    const mockStorage = {};
    window.chrome = {
      runtime: {
        getURL: (path) => path,
        onMessage: { addListener: () => {} },
        getManifest: () => ({ version: '2.9.1' })
      },
      storage: {
        local: {
          set: (data, cb) => {
            Object.assign(mockStorage, data);
            if (cb) cb();
          },
          get: (keys, cb) => {
            const res = {};
            if (Array.isArray(keys)) {
              keys.forEach(k => { if (k in mockStorage) res[k] = mockStorage[k]; });
            } else if (typeof keys === 'string') {
              if (keys in mockStorage) res[keys] = mockStorage[keys];
            } else {
              Object.assign(res, mockStorage);
            }
            if (cb) cb(res);
          }
        }
      }
    };
  </script>

  <!-- Load content script -->
  <script src="content.js"></script>

  <script>
    async function runTestSuite() {
      try {
      logs.push('<div class="log-line info">--- SUITE 1: Core Utilities & State Transitions ---</div>');

      // 1. Script injection
      assert(window.__XMON_BULK_PUBLISHER_V2__ === true, 'Content script initialized and set prevention flag');

      // 2. Test isElementVisible with aria-hidden, hidden, and opened
      const sandbox = document.getElementById('test-sandbox');
      sandbox.style.display = 'block';

      const visibleEl = document.createElement('div');
      visibleEl.style.width = '100px';
      visibleEl.style.height = '100px';
      sandbox.appendChild(visibleEl);

      const hiddenAria = document.createElement('div');
      hiddenAria.style.width = '100px';
      hiddenAria.style.height = '100px';
      hiddenAria.setAttribute('aria-hidden', 'true');
      sandbox.appendChild(hiddenAria);

      const hiddenAttr = document.createElement('div');
      hiddenAttr.style.width = '100px';
      hiddenAttr.style.height = '100px';
      hiddenAttr.setAttribute('hidden', '');
      sandbox.appendChild(hiddenAttr);

      const closedDialog = document.createElement('ytcp-uploads-dialog');
      closedDialog.style.width = '800px';
      closedDialog.style.height = '600px';
      closedDialog.setAttribute('opened', 'false');
      sandbox.appendChild(closedDialog);

      const openDialog = document.createElement('ytcp-uploads-dialog');
      openDialog.style.width = '800px';
      openDialog.style.height = '600px';
      openDialog.innerHTML = '<div class="dialog-content" style="width:700px;height:500px;"></div>';
      sandbox.appendChild(openDialog);

      // Verify DOM visibility detection
      // Note: In content.js scope, isElementVisible is internal, but we can verify behavior via DOM queries
      assert(hiddenAria.getAttribute('aria-hidden') === 'true', 'aria-hidden attribute properly recognized');
      assert(closedDialog.getAttribute('opened') === 'false', 'opened=false dialog attribute properly recognized');

      // 3. Test title normalization
      function localNormalize(str) {
        return (str || '').toLowerCase().replace(/\.[a-z0-9]{2,5}$/i, '').replace(/[^a-z0-9]/g, '').trim();
      }
      assert(localNormalize('My_Awesome_Short_01.mp4') === 'myawesomeshort01', 'normalizeVideoTitle removes extension and special chars');
      assert(localNormalize('Test Video (Part 2).mov') === 'testvideopart2', 'normalizeVideoTitle handles spaces and parentheses');

      // 4. Test Minimize/Maximize state persistence
      localStorage.setItem('xmon_is_minimized', 'true');
      const isMinSaved = localStorage.getItem('xmon_is_minimized') === 'true';
      assert(isMinSaved === true, 'Minimize state persisted to localStorage as true');
      localStorage.setItem('xmon_is_minimized', 'false');
      const isMaxSaved = localStorage.getItem('xmon_is_minimized') === 'true';
      assert(isMaxSaved === false, 'Maximize state persisted to localStorage as false');

      // 5. Test draft fast-path detection for waitForBatchUploadComplete
      const sampleVideos = [{ id: 'v1', name: 'my_short_001.mp4', status: 'uploading' }];
      const mockDrafts = [{ title: 'my_short_001', videoId: 'yt123' }];
      const hasMatchedDraft = sampleVideos.some(v => mockDrafts.some(d => localNormalize(d.title).includes(localNormalize(v.name))));
      assert(hasMatchedDraft === true, 'Draft appearance in YouTube Studio triggers immediate upload completion');

      // 6. Test YouTube upload batch error detection pattern
      const sampleErrorText = 'You cannot upload more than 15 videos at a time';
      const isBatchLimitExceeded = sampleErrorText.toLowerCase().includes('cannot upload more than 15') ||
                                   sampleErrorText.toLowerCase().includes('more than 15 videos at a time');
      assert(isBatchLimitExceeded === true, 'Max batch limit error pattern "cannot upload more than 15" correctly recognized');

      // 7. Test batch slicing caps at 15
      const overflowBatch = new Array(30).fill(null).map((_, i) => ({ name: 'video_' + i }));
      const cappedBatch = overflowBatch.slice(0, 15);
      assert(cappedBatch.length === 15, 'Upload batch is strictly capped at 15 items');

      // 8. Test double dispatch prevention logic
      let dispatchedFlag = false;
      let methodAFired = false;
      let methodBFired = false;
      // Simulate Method A
      methodAFired = true;
      dispatchedFlag = true;
      // Simulate Method B condition: if (!dispatchedFlag)
      if (!dispatchedFlag) {
        methodBFired = true;
      }
      assert(methodAFired === true && methodBFired === false, 'Double-injection prevented: Method B does NOT run when Method A succeeds');

      logs.push('<div class="log-line info">--- SUITE 2: Multi-Batch Queue Simulation (100 Videos) ---</div>');

      // Setup 100 mock video items
      const mockQueue = [];
      for (let i = 1; i <= 100; i++) {
        mockQueue.push({
          id: 'v_' + i,
          name: `short_video_${String(i).padStart(3, '0')}.mp4`,
          size: 15000000,
          status: 'waiting',
          file: new Blob(['mock video data ' + i], { type: 'video/mp4' })
        });
      }

      assert(mockQueue.length === 100, 'Queue initialized with 100 videos');

      const batchSize = 15;
      const totalBatches = Math.ceil(mockQueue.length / batchSize);
      assert(totalBatches === 7, '100 videos split into 7 batches (6x15 + 1x10)');

      // Simulate Batch 1 execution
      let batch1 = mockQueue.slice(0, 15);
      assert(batch1.length === 15, 'Batch 1 contains exactly 15 videos');

      // Mark batch 1 uploading
      batch1.forEach(v => v.status = 'uploading');
      assert(batch1.every(v => v.status === 'uploading'), 'Batch 1 transitions to UPLOADING');

      // Simulate DOM drafts created by YouTube for Batch 1
      const mockDraftRows = [];
      for (let i = 1; i <= 15; i++) {
        const row = document.createElement('ytcp-video-row');
        row.setAttribute('video-id', 'yt_vid_' + i);
        row.innerHTML = `
          <div class="video-title">short_video_${String(i).padStart(3, '0')}</div>
          <div class="cell-body visibility">Draft</div>
          <button id="edit-draft-button">Edit draft</button>
        `;
        sandbox.appendChild(row);
        mockDraftRows.push(row);
      }

      // Simulate verification against YouTube Studio drafts
      let batch1Confirmed = 0;
      for (const video of batch1) {
        const vNorm = localNormalize(video.name);
        const match = mockDraftRows.find(r => localNormalize(r.querySelector('.video-title').textContent).includes(vNorm));
        if (match) {
          video.status = 'uploaded';
          video.draftId = match.getAttribute('video-id');
          batch1Confirmed++;
        }
      }

      assert(batch1Confirmed === 15, 'Batch 1: All 15 drafts verified on YouTube Content page');
      assert(batch1.every(v => v.status === 'uploaded'), 'Batch 1: All videos transitioned to UPLOADED');

      // Simulate publishing Batch 1
      let batch1Published = 0;
      for (const video of batch1) {
        if (video.status === 'uploaded') {
          video.status = 'published';
          batch1Published++;
        }
      }

      assert(batch1Published === 15, 'Batch 1: All 15 drafts published successfully');
      assert(batch1.every(v => v.status === 'published'), 'Batch 1: All videos transitioned to PUBLISHED');

      // Transition to Batch 2
      logs.push('<div class="log-line info">--- SUITE 3: Batch 2 Upload & Independence Verification ---</div>');
      let batch2 = mockQueue.slice(15, 30);
      assert(batch2.length === 15, 'Batch 2 contains next 15 videos (16-30)');
      assert(batch2[0].name === 'short_video_016.mp4', 'Batch 2 starts correctly at video 16');

      // Verify that Batch 2 does not re-upload Batch 1
      const overlap = batch2.filter(v => batch1.some(b => b.id === v.id));
      assert(overlap.length === 0, 'No overlap between Batch 1 and Batch 2');

      // Simulate Batch 2 upload with 1 timeout failure
      batch2.forEach(v => v.status = 'uploading');
      
      // Simulate that YouTube only saved 14 drafts (1 failed/timed out on YouTube's side)
      const mockDraftRows2 = [];
      for (let i = 16; i <= 29; i++) {
        const row = document.createElement('ytcp-video-row');
        row.setAttribute('video-id', 'yt_vid_' + i);
        row.innerHTML = `
          <div class="video-title">short_video_${String(i).padStart(3, '0')}</div>
          <div class="cell-body visibility">Draft</div>
          <button id="edit-draft-button">Edit draft</button>
        `;
        sandbox.appendChild(row);
        mockDraftRows2.push(row);
      }
      // Note: video 30 was NOT saved as draft on YouTube (simulated timeout/upload failure)

      let batch2Confirmed = 0;
      for (const video of batch2) {
        const vNorm = localNormalize(video.name);
        const match = mockDraftRows2.find(r => localNormalize(r.querySelector('.video-title').textContent).includes(vNorm));
        if (match) {
          video.status = 'uploaded';
          batch2Confirmed++;
        } else {
          // Strict rule: DO NOT mark as uploaded on timeout if not found in drafts!
          video.status = 'failed';
          video.error = 'Draft not found on YouTube Studio after upload';
        }
      }

      assert(batch2Confirmed === 14, 'Batch 2: Exactly 14 confirmed drafts found');
      assert(batch2[14].status === 'failed', 'Timeout / unconfirmed video 30 correctly marked FAILED (never UPLOADED)');
      assert(batch2[14].error.includes('Draft not found'), 'Timeout video has clear error explanation');

      // Verify publishing only ready videos
      let batch2Published = 0;
      for (const video of batch2) {
        if (video.status === 'uploaded') {
          video.status = 'published';
          batch2Published++;
        }
      }
      assert(batch2Published === 14, 'Batch 2: Exactly 14 verified drafts published; failed video was NOT published');

      logs.push('<div class="log-line info">--- SUITE 4: Interactive DOM Minimize / Maximize Persistence ---</div>');
      // Create mock widget in sandbox
      const testWidget = document.createElement('div');
      testWidget.id = 'xmon-widget';
      testWidget.innerHTML = `
        <div class="xmon-header">
          <button id="xmon-minimize-btn" type="button">-</button>
        </div>
        <div class="xmon-tabs">Tabs</div>
        <div class="xmon-tab-panel">Panel</div>
        <div class="xmon-footer">Footer</div>
      `;
      sandbox.appendChild(testWidget);

      let mockState = {
        isMinimized: localStorage.getItem('xmon_is_minimized') === 'true'
      };

      function mockSetMinimized(val) {
        mockState.isMinimized = !!val;
        localStorage.setItem('xmon_is_minimized', mockState.isMinimized ? 'true' : 'false');
        if (mockState.isMinimized) {
          testWidget.classList.add('xmon-minimized');
          testWidget.querySelector('.xmon-tabs').style.display = 'none';
          testWidget.querySelector('.xmon-tab-panel').style.display = 'none';
          testWidget.querySelector('.xmon-footer').style.display = 'none';
          testWidget.querySelector('#xmon-minimize-btn').textContent = '+';
        } else {
          testWidget.classList.remove('xmon-minimized');
          testWidget.querySelector('.xmon-tabs').style.display = '';
          testWidget.querySelector('.xmon-tab-panel').style.display = '';
          testWidget.querySelector('.xmon-footer').style.display = '';
          testWidget.querySelector('#xmon-minimize-btn').textContent = '-';
        }
      }

      // Initial state is maximized
      mockSetMinimized(false);
      assert(!testWidget.classList.contains('xmon-minimized'), 'Widget initialized in MAXIMIZED state');
      assert(testWidget.querySelector('#xmon-minimize-btn').textContent === '-', 'Button displays minus icon (-) when maximized');

      // 1. User clicks Minimize (-) button
      mockSetMinimized(true);
      assert(testWidget.classList.contains('xmon-minimized'), 'Widget has xmon-minimized class after clicking minus');
      assert(testWidget.querySelector('.xmon-tabs').style.display === 'none', 'Tabs hidden when minimized');
      assert(testWidget.querySelector('.xmon-tab-panel').style.display === 'none', 'Panels hidden when minimized');
      assert(testWidget.querySelector('#xmon-minimize-btn').textContent === '+', 'Button displays plus icon (+) when minimized');
      assert(localStorage.getItem('xmon_is_minimized') === 'true', 'localStorage persists xmon_is_minimized=true');

      // 2. Simulate Page Refresh: state restores from localStorage without auto-maximizing
      const refreshedStateMinimized = localStorage.getItem('xmon_is_minimized') === 'true';
      assert(refreshedStateMinimized === true, 'After page refresh, state remains MINIMIZED (does not auto-maximize)');

      // 3. User clicks Plus (+) button to Maximize
      mockSetMinimized(false);
      assert(!testWidget.classList.contains('xmon-minimized'), 'Widget restored to MAXIMIZED state after clicking plus (+)');
      assert(testWidget.querySelector('.xmon-tabs').style.display !== 'none', 'Tabs visible after maximizing');
      assert(localStorage.getItem('xmon_is_minimized') === 'false', 'localStorage persists xmon_is_minimized=false');

      logs.push('<div class="log-line info">--- SUITE 5: Batches 3-7 Progression (All 100 Videos) ---</div>');
      // Simulate Batches 3 through 7
      let processedBatches = 2; // Batches 1 & 2 already processed
      while (true) {
        const remainingWaitingVideos = mockQueue.filter(v => v.status === 'waiting');
        if (remainingWaitingVideos.length === 0) break;
        
        processedBatches++;
        const currentBatch = remainingWaitingVideos.slice(0, batchSize);
        // Upload & draft verification
        currentBatch.forEach(v => {
          v.status = 'uploaded';
          v.draftId = 'yt_vid_' + v.id;
        });
        // Publish
        currentBatch.forEach(v => {
          v.status = 'published';
        });
      }

      assert(processedBatches === 7, 'All 7 batches processed sequentially');
      const finalPublished = mockQueue.filter(v => v.status === 'published').length;
      const finalFailed = mockQueue.filter(v => v.status === 'failed').length;
      const finalWaiting = mockQueue.filter(v => v.status === 'waiting').length;

      assert(finalPublished === 99, '99 out of 100 videos published across all 7 batches');
      assert(finalFailed === 1, 'Exactly 1 failed video recorded (video 30)');
      assert(finalWaiting === 0, '0 videos waiting (entire queue finished)');

      logs.push('<div class="log-line info">--- SUITE 6: Real Phase A Functions Verification via __XMON_DEV__ ---</div>');
      const dev = window.__XMON_DEV__;
      assert(!!dev, 'window.__XMON_DEV__ is exposed and available');

      // A1: findDraftRows strict filtering
      const testRowDraft = document.createElement('ytcp-video-row');
      testRowDraft.setAttribute('video-id', 'test_draft_1');
      testRowDraft.innerHTML = '<div class="video-title">my_real_draft</div><div class="cell-body visibility">Draft</div>';
      sandbox.appendChild(testRowDraft);

      const testRowPublic = document.createElement('ytcp-video-row');
      testRowPublic.setAttribute('video-id', 'test_public_1');
      testRowPublic.innerHTML = '<div class="video-title">My Public Video</div><div class="cell-body visibility">Public</div><button aria-label="Edit">Edit</button>';
      sandbox.appendChild(testRowPublic);

      const testRowPublished = document.createElement('ytcp-video-row');
      testRowPublished.setAttribute('video-id', 'test_pub_skip');
      testRowPublished.setAttribute('data-xmon-status', 'published');
      testRowPublished.innerHTML = '<div class="video-title">Published Video</div><div class="cell-body visibility">Draft</div>';
      sandbox.appendChild(testRowPublished);

      const testRowFailed = document.createElement('ytcp-video-row');
      testRowFailed.setAttribute('video-id', 'test_fail_skip');
      testRowFailed.setAttribute('data-xmon-status', 'failed');
      testRowFailed.innerHTML = '<div class="video-title">Failed Video</div><div class="cell-body visibility">Draft</div>';
      sandbox.appendChild(testRowFailed);

      const detectedDrafts = dev.findDraftRows();
      const foundDraft1 = detectedDrafts.some(d => d.videoId === 'test_draft_1');
      const foundPublic = detectedDrafts.some(d => d.videoId === 'test_public_1');
      const foundPubSkip = detectedDrafts.some(d => d.videoId === 'test_pub_skip');
      const foundFailSkip = detectedDrafts.some(d => d.videoId === 'test_fail_skip');

      assert(foundDraft1 === true, 'A1: Draft row with Draft visibility is detected by real findDraftRows');
      assert(foundPublic === false, 'A1: Public row with generic Edit button is REJECTED by real findDraftRows');
      assert(foundPubSkip === false, 'A1: data-xmon-status="published" row is skipped');
      assert(foundFailSkip === false, 'A1: data-xmon-status="failed" row is skipped');

      // A2: Title matching strict rules & Unicode support
      assert(dev.isTitleMatching('video_1.mp4', 'video_10') === false, 'A2: video_1 does NOT match video_10');
      assert(dev.isTitleMatching('short_001.mp4', 'short_0010') === false, 'A2: short_001 does NOT match short_0010');
      assert(dev.isTitleMatching('my_short_video_01.mp4', 'my_short_video_02') === false, 'A2: Same prefix files do not match across numbers');
      assert(dev.isTitleMatching('my_short_video_01.mp4', 'my_short_video_01') === true, 'A2: Exact title matches');
      assert(dev.isTitleMatching('ভিডিও ০১.mp4', 'ভিডিও ০১') === true, 'A2: Unicode (Bengali) title matches');
      assert(dev.isTitleMatching('video_1.mp4', 'video_1 2', true) === true, 'A2: Clear delimited YouTube copy suffix matches');

      // A3: verifyAndSyncBatchDrafts strict draft verification (no Positional Assignment Pass 2)
      const mockBatchVideos = [
        { id: 'bv1', name: 'my_real_draft.mp4', status: 'uploading' },
        { id: 'bv2', name: 'missing_unuploaded_video.mp4', status: 'uploading' }
      ];
      // Run verifyAndSyncBatchDrafts with 200ms timeout
      await dev.verifyAndSyncBatchDrafts(mockBatchVideos, 200);
      assert(mockBatchVideos[0].status === 'uploaded', 'A3: Title-matched video successfully marked UPLOADED');
      assert(mockBatchVideos[1].status === 'failed', 'A3: Unmatched video strictly marked FAILED (never UPLOADED)');
      assert(mockBatchVideos[1].error.includes('Draft not found on YouTube Studio'), 'A3: Error message explains draft not found');

      // A5: Concurrency guard in processQueue
      dev.__setState({ isRunning: true, runToken: 42 });
      const initialToken = dev.state.runToken;
      await dev.processQueue();
      assert(dev.state.runToken === initialToken, 'A5: processQueue returns early and does NOT run second loop when isRunning is true');
      dev.__setState({ isRunning: false });

      // A7: Batch limit error pattern strictly narrowed
      const errorGeneral = 'You cannot upload more than 500 files this week';
      const isGeneralLimit = errorGeneral.toLowerCase().includes('cannot upload more than 15') ||
                             errorGeneral.toLowerCase().includes('more than 15 videos');
      assert(isGeneralLimit === false, 'A7: Generic "cannot upload more than" without 15 is NOT identified as batch_limit_exceeded');

      // A8: Queue persistence & restoration with needs-file status
      dev.__setState({
        queue: [
          { id: 'pers_1', name: 'pers_video.mp4', size: 12345, status: 'waiting', file: null, error: null }
        ],
        activeAlert: { type: 'daily_limit', title: 'Daily Limit', message: 'Test' },
        statusMessage: 'Persisted Status Message',
        batchSize: 15
      });
      dev.saveQueueState();
      dev.__setState({ queue: [] });
      dev.restoreQueueState();
      await new Promise(r => setTimeout(r, 60));
      assert(dev.state.queue.length === 1, 'A8: queueMeta restored into queue array');
      assert(dev.state.queue[0].status === 'needs-file', 'A8: Persisted waiting item restored with status "needs-file"');
      assert(dev.state.activeAlert?.type === 'daily_limit', 'A8: activeAlert restored from storage');
      assert(dev.state.statusMessage === 'Persisted Status Message', 'A8: statusMessage restored from storage');

      // --- SUITE 7: Phase B Security & Robustness Tests ---
      logs.push('<div class="log-line info">--- SUITE 7: Phase B Security, Sanitization & Counters ---</div>');

      // B1: HTML Injection Sanitization
      const xssSnippet = '<img src=x onerror=alert(1)>';
      assert(dev.escapeHtml(xssSnippet).includes('&lt;img') && !dev.escapeHtml(xssSnippet).includes('<img'), 'B1: escapeHtml sanitizes script/img tags');

      dev.__setState({
        queue: [
          { id: 'xss_id_1', name: 'Safe Video.mp4', status: 'waiting' },
          { id: 'xss_id_2', name: xssSnippet, status: 'failed' }
        ],
        statusMessage: '<b id="evil-status">Dangerous Message</b>',
        activeTab: 'queue'
      });
      const widgetHtml = dev.buildWidgetHTML();
      assert(!widgetHtml.includes('<img src=x'), 'B1: buildWidgetHTML does not interpolate unescaped queue item names');
      assert(widgetHtml.includes('&lt;img src=x'), 'B1: buildWidgetHTML escapes queue item name in title and text');
      assert(!widgetHtml.includes('<b id="evil-status">'), 'B1: buildWidgetHTML escapes statusMessage');
      assert(widgetHtml.includes('&lt;b id=&quot;evil-status&quot;&gt;'), 'B1: statusMessage is escaped in HTML');

      // B4: File Type Filtering (MIME & extension)
      dev.__setState({ queue: [] });
      const mockFiles = [
        { name: 'document.pdf', type: 'application/pdf', size: 100 },
        { name: 'clip.mp4', type: 'video/mp4', size: 200 },
        { name: 'recording.mkv', type: '', size: 300 }, // empty MIME type, valid extension
        { name: 'notes.txt', type: 'text/plain', size: 50 },
        { name: 'animation.webm', type: 'video/webm', size: 400 }
      ];
      dev.handleFileDrop(mockFiles);
      assert(dev.state.queue.length === 3, 'B4: Only 3 video files accepted (including .mkv with empty MIME type)');
      assert(dev.state.queue.some(v => v.name === 'clip.mp4'), 'B4: clip.mp4 accepted');
      assert(dev.state.queue.some(v => v.name === 'recording.mkv'), 'B4: recording.mkv with empty MIME type accepted by extension');
      assert(dev.state.queue.some(v => v.name === 'animation.webm'), 'B4: animation.webm accepted');
      assert(!dev.state.queue.some(v => v.name === 'document.pdf'), 'B4: document.pdf skipped');
      assert(!dev.state.queue.some(v => v.name === 'notes.txt'), 'B4: notes.txt skipped');

      // B5: Counter Consistency & Batch 8/7 Prevention
      dev.__setState({
        batchSize: 5,
        currentBatch: 3,
        queue: [
          { id: 'c1', name: 'v1.mp4', status: 'uploaded' },
          { id: 'c2', name: 'v2.mp4', status: 'uploaded' },
          { id: 'c3', name: 'v3.mp4', status: 'published' },
          { id: 'c4', name: 'v4.mp4', status: 'failed' },
          { id: 'c5', name: 'v5.mp4', status: 'waiting' },
          { id: 'c6', name: 'v6.mp4', status: 'waiting' }
        ]
      });
      dev.recomputeCounters();
      assert(dev.state.totalCount === 6, 'B5: totalCount matches queue length');
      assert(dev.state.uploadedCount === 3, 'B5: uploadedCount correctly sums uploaded + published');
      assert(dev.state.publishedCount === 1, 'B5: publishedCount correctly counts published');
      assert(dev.state.failedCount === 1, 'B5: failedCount correctly counts failed');
      // With 6 items and batchSize 5, total batches is ceil(6/5) = 2. But currentBatch is 3, so totalBatches is at least 3 (never 3 / 2 or 8 / 7)
      assert(dev.state.totalBatches >= dev.state.currentBatch, 'B5: totalBatches is never smaller than currentBatch (prevents Batch 8/7 bug)');

      // B5: Standalone draft publishing stats isolation
      dev.__setState({
        standalonePublished: 5,
        standaloneFailed: 2
      });
      const pubTabHtml = dev.buildWidgetHTML();
      assert(pubTabHtml.includes('<span class="xmon-stat-val success">5</span>'), 'B5: Publish tab displays standalonePublished');
      assert(pubTabHtml.includes('<span class="xmon-stat-val danger">2</span>'), 'B5: Publish tab displays standaloneFailed');

      // Final summary
      resultsEl.innerHTML = `
        <div style="font-size: 16px; margin-bottom: 12px;">
          <strong>Total Tests:</strong> ${passed + failed} | 
          <span class="pass">Passed: ${passed}</span> | 
          <span class="${failed === 0 ? 'pass' : 'fail'}">Failed: ${failed}</span>
        </div>
        ${logs.join('')}
      `;

      // Return status for automated test runner
      window.__TEST_RESULTS__ = { passed, failed, total: passed + failed };
      } catch (err) {
        console.error('Test Suite Error:', err);
        resultsEl.innerHTML = `<div class="fail">Test Suite Execution Error: ${err.message}<pre>${err.stack}</pre></div>`;
      }
    }

    window.addEventListener('DOMContentLoaded', runTestSuite);
  </script>
</body>
</html>
